syntax = "proto3";

package rem.person.v1;

option go_package = "github.com/rem-gestion/api-suite/person/internal/pb;pb";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

/* ─────────────────────────  ENUMS  ────────────────────────── */
enum PersonType {
  PERSON_TYPE_UNSPECIFIED = 0;
  INDIVIDUAL              = 1;
  COMPANY                 = 2;
}

enum Sexo {
  SEXO_UNSPECIFIED = 0;
  MASCULINO        = 1;
  FEMENINO         = 2;
}

enum ContactType {
  CONTACT_TYPE_UNSPECIFIED = 0;
  EMAIL                    = 1;
  PHONE                    = 2;
  WHATSAPP                 = 3;
}

/* ───────────────────────  PERSON SERVICE  ─────────────────── */
service PersonService {
  // Personas --------------------------------------------------
  rpc CreatePerson (CreatePersonRequest) returns (PersonResponse);
  rpc GetPerson    (GetPersonRequest)    returns (PersonResponse);
  rpc ListPersons  (ListPersonsRequest)  returns (ListPersonsResponse);
  rpc UpdatePerson (UpdatePersonRequest) returns (PersonResponse);
  rpc DeletePerson (DeletePersonRequest) returns (google.protobuf.Empty);

  // Contactos -------------------------------------------------
  rpc AddContact       (AddContactRequest)       returns (ContactResponse);
  rpc UpdateContact    (UpdateContactRequest)    returns (ContactResponse);
  rpc DeleteContact    (DeleteContactRequest)    returns (google.protobuf.Empty);
  rpc ListContacts     (ListContactsRequest)     returns (ListContactsResponse);
}

/* ─────────────────────────  PERSON  ───────────────────────── */
message PersonResponse {
  string id                      = 1;
  PersonType type                = 2;
  string address_id              = 3;   // puede ser vacío
  string avatar_url              = 4;   // puede ser vacío
  Sexo sexo                      = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;

  oneof details {
    Individual individual = 8;
    Company    company    = 9;
  }

  repeated Contact contacts = 10;
}

message Individual {
  string first_name = 1;
  string last_name  = 2;
  string dni        = 3;
}

message Company {
  string legal_name   = 1;
  string cuit         = 2;
  string society_type = 3; // SA | SRL | SAS | …
}

/* ─────────────────────  CONTACT EMBED  ────────────────────── */
message Contact {
  string id          = 1;
  ContactType tipo   = 2;
  string dato        = 3;
  bool is_primary    = 4;
  google.protobuf.Timestamp created_at = 5;
}

/* ───────────────────────  REQUESTS  ───────────────────────── */
// Personas
message CreatePersonRequest {
  PersonType type   = 1;                                  // required
  string address_id = 2;
  string avatar_url = 3;
  Sexo sexo         = 4;

  oneof details {                                         // required uno
    CreateIndividual individual = 5;
    CreateCompany    company    = 6;
  }

  repeated AddContactPayload contacts = 7;                // opcional
}

message UpdatePersonRequest {
  string id        = 1;                                   // required
  string address_id = 2;
  string avatar_url = 3;
  Sexo sexo         = 4;

  oneof details {
    UpdateIndividual individual = 5;
    UpdateCompany    company    = 6;
  }
}

message GetPersonRequest    { string id = 1; }
message DeletePersonRequest { string id = 1; }

message ListPersonsRequest {
  uint32 page      = 1;
  uint32 per_page  = 2;
  string search    = 3; // nombre, cuit, dni
}
message ListPersonsResponse {
  repeated PersonResponse data  = 1;
  uint32 total                  = 2;
}

// Contactos
message AddContactRequest {
  string person_id           = 1;                         // required
  AddContactPayload payload  = 2;                         // required
}

message AddContactPayload {
  ContactType tipo  = 1;                                  // required
  string dato       = 2;                                  // required
  bool is_primary   = 3;
}

message UpdateContactRequest {
  string id                     = 1;                      // required
  ContactType tipo              = 2;
  string dato                   = 3;
  bool is_primary               = 4;
}

message DeleteContactRequest { string id = 1; }

message ListContactsRequest  { string person_id = 1; }
message ListContactsResponse { repeated Contact data = 1; }

/* --------- sub-payloads para individuo / empresa ---------- */
message CreateIndividual {
  string first_name = 1;                                  // required
  string last_name  = 2;                                  // required
  string dni        = 3;
}
message UpdateIndividual {
  string first_name = 1;
  string last_name  = 2;
  string dni        = 3;
}

message CreateCompany {
  string legal_name   = 1;                                // required
  string cuit         = 2;
  string society_type = 3;
}
message UpdateCompany {
  string legal_name   = 1;
  string cuit         = 2;
  string society_type = 3;
}

/* ───────────────────  CONTACT RESPONSE  ───────────────────── */
message ContactResponse {
  string id        = 1;
  string person_id = 2;
  ContactType tipo = 3;
  string dato      = 4;
  bool is_primary  = 5;
  google.protobuf.Timestamp created_at = 6;
}
