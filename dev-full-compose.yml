version: "3.9"

services:
  # ───────────────────── Shared DB for Development ─────────────────────
  postgres-dev:
    image: postgres:16-alpine
    container_name: rem-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: supersecreta
      POSTGRES_DB: rem_development
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init-dev-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d rem_development"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────── RabbitMQ for Organization Service ─────────────────────
  rabbitmq-dev:
    image: rabbitmq:3-management
    container_name: rem-rabbitmq-dev
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: supersecreta
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

  # ───────────────────── Redis for Cache ─────────────────────
  redis-dev:
    image: redis:7-alpine
    container_name: rem-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ───────────────────── API Gateway (nginx) ─────────────────────
  api-gateway:
    image: nginx:alpine
    container_name: rem-api-gateway
    restart: unless-stopped
    ports:
      - "8081:80"  # API Gateway disponible en localhost:8081
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      postgres-dev:
        condition: service_healthy
      rabbitmq-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  rabbitmq_dev_data:
  redis_dev_data:


