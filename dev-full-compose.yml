version: "3.9"

services:
  # ───────────────────── Shared DB for Development ─────────────────────
  postgres-dev:
    image: postgres:16-alpine
    container_name: rem-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: supersecreta
      POSTGRES_DB: rem_development
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init-dev-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d rem_development"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────────────── API Gateway (nginx) ─────────────────────
  api-gateway:
    image: nginx:alpine
    container_name: rem-api-gateway
    restart: unless-stopped
    ports:
      - "8081:80"  # API Gateway disponible en localhost:8081
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      postgres-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3


