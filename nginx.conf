events {}

http {
    # Configuración para desarrollo local
    # Los servicios corren en localhost con puertos específicos
    
    upstream auth_backend {
        server host.docker.internal:4002;  # auth-identity-svc
    }

    upstream person_backend {
        server host.docker.internal:4001;  # person-svc
    }

    upstream address_backend {
        server host.docker.internal:4000;  # address-svc
    }

    upstream organization_backend {
        server host.docker.internal:4003;  # organization-svc
    }

    server {
        listen 80;
        server_name localhost;

        # Health check del API Gateway
        location /health {
            return 200 '{"status":"ok","service":"api-gateway","version":"1.0.0"}';
            add_header Content-Type application/json;
        }

        # Auth Service - Autenticación y usuarios
        location /api/auth/ {
            proxy_pass http://auth_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/users {
            proxy_pass http://auth_backend/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Person Service - Gestión de personas y contactos
        location /api/persons {
            proxy_pass http://person_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/contacts {
            proxy_pass http://person_backend/contacts/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Address Service - Gestión de direcciones
        location /api/addresses {
            proxy_pass http://address_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Organization Service - Gestión de organizaciones
        location /api/organizations {
            proxy_pass http://organization_backend/organizations;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/invites {
            proxy_pass http://organization_backend/invites;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/maintenance {
            proxy_pass http://organization_backend/maintenance;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health checks individuales de servicios
        location /api/health/auth {
            proxy_pass http://auth_backend/health;
            proxy_set_header Host $host;
        }

        location /api/health/person {
            proxy_pass http://person_backend/health;
            proxy_set_header Host $host;
        }

        location /api/health/address {
            proxy_pass http://address_backend/health;
            proxy_set_header Host $host;
        }

        location /api/health/organization {
            proxy_pass http://organization_backend/health;
            proxy_set_header Host $host;
        }

        # Fallback para rutas no encontradas
        location / {
            return 404 '{"error":"Not Found","message":"Use /api/{service}/ endpoints"}';
            add_header Content-Type application/json;
        }
    }
}
